{% extends "meetalign/base.html" %}
{% block content %}
<h1>{{ meeting.title }} 회의 요약</h1>
<p><a href="{% url 'meeting_detail' team.id project.id meeting.id %}">회의로 돌아가기</a></p>
{% if summary %}
<p>(회의록 v{{ minutes.version }} 기준)</p>
<pre>{{ summary.content }}</pre>
{% else %}
<p>아직 요약이 없습니다.</p>
{% endif %}
<p><a href="{% url 'understanding' team.id project.id meeting.id %}">이해도 검증</a></p>
{% endblock %}
