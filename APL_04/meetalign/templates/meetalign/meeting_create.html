{% extends "meetalign/base.html" %}
{% block content %}
<h1>{{ project.name }} 회의 생성</h1>
<p><a href="{% url 'meeting_list' team.id project.id %}">회의 목록으로 돌아가기</a></p>
{% if context_warning %}<p class="warning">경고: 이 프로젝트의 회의 요약이 맥락 한도에 가까워졌습니다. 새 회의를 추가하면 기존 회의록이 대화 맥락에서 제외될 수 있습니다.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<input name="title" placeholder="회의 제목"><button>생성</button>
</form>
{% endblock %}
