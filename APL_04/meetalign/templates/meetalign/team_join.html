{% extends "meetalign/base.html" %}
{% block content %}
<h1>팀 생성/참여</h1>
<p><a href="{% url 'index' %}">처음으로</a></p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<h2>팀 생성</h2>
<form method="post">{% csrf_token %}
<input type="hidden" name="action" value="create">
<input name="name" placeholder="팀 이름"><button>팀 생성</button>
</form>
<h2>초대 코드로 참여</h2>
<form method="post">{% csrf_token %}
<input type="hidden" name="action" value="join">
<input name="invite_code" placeholder="초대 코드"><button>팀 참여</button>
</form>
{% endblock %}
